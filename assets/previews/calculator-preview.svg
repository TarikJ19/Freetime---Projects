<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Advanced Calculator Preview</title>
  <desc id="desc">Preview image of the calculator project layout with display, history, and controls.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8f2e8" />
      <stop offset="100%" stop-color="#efe2cf" />
    </linearGradient>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)" />

  <rect x="80" y="70" width="1040" height="560" rx="24" fill="#fff9f1" stroke="#d2c4b2" stroke-width="2" />
  <rect x="80" y="70" width="1040" height="58" rx="24" fill="#2a5f92" />
  <circle cx="115" cy="99" r="8" fill="#f8f2e8" />
  <circle cx="140" cy="99" r="8" fill="#f8f2e8" />
  <circle cx="165" cy="99" r="8" fill="#f8f2e8" />

  <text x="210" y="105" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Project 1 - Advanced Calculator</text>

  <rect x="120" y="160" width="320" height="430" rx="18" fill="#ffffff" stroke="#d7cbbb" />
  <text x="145" y="198" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="700" fill="#201912">History</text>

  <rect x="145" y="220" width="270" height="74" rx="12" fill="#f6f0e7" stroke="#d9cdbd" />
  <text x="160" y="248" font-family="Manrope, Arial, sans-serif" font-size="15" fill="#5b4f44">2*(3+4)</text>
  <text x="160" y="274" font-family="Fraunces, Georgia, serif" font-size="22" font-weight="700" fill="#201912">14</text>

