  <text x="535" y="255" font-family="Fraunces, Georgia, serif" font-size="30" fill="#201912">(150 + 25%) * 2</text>
  <text x="535" y="292" font-family="Fraunces, Georgia, serif" font-size="38" font-weight="700" fill="#201912">375</text>

