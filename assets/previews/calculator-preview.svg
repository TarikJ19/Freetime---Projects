    <rect x="510" y="338" width="92" height="48" rx="10" fill="#ffffff" stroke="#d3c5b3" /><text x="556" y="368" fill="#201912">MC</text>
    <rect x="614" y="338" width="92" height="48" rx="10" fill="#ffffff" stroke="#d3c5b3" /><text x="660" y="368" fill="#201912">MR</text>
    <rect x="718" y="338" width="92" height="48" rx="10" fill="#ffffff" stroke="#d3c5b3" /><text x="764" y="368" fill="#201912">M+</text>
    <rect x="822" y="338" width="92" height="48" rx="10" fill="#ffffff" stroke="#d3c5b3" /><text x="868" y="368" fill="#201912">M-</text>
    <rect x="926" y="338" width="124" height="48" rx="10" fill="#2a5f92" /><text x="988" y="368" fill="#ffffff">=</text>

