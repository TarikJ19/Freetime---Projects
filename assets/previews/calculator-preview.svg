  <text x="160" y="334" font-family="Manrope, Arial, sans-serif" font-size="15" fill="#5b4f44">sqrt(81)</text>
  <text x="160" y="360" font-family="Fraunces, Georgia, serif" font-size="22" font-weight="700" fill="#201912">9</text>

